<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pants.family</title>
  <meta name="description" content="He’s protecting you from it.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pants.family/">
  <meta property="og:title" content="pants.family">
  <meta property="og:description" content="He’s protecting you from it.">
  <meta property="og:image" content="https://pants.family/cat.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">

  <style>
    :root {
      --bg: #0f0e0d;
      --fg: #e8e3db;
      --muted: #8a827a;
      --glow: rgba(255, 214, 132, 0.16);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2rem 1.25rem;
      text-align: center;
      /* warm pool of light behind the cat */
      background-image: radial-gradient(ellipse at 50% 42%, var(--glow), transparent 62%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    figure { margin: 0; }

    img {
      display: block;
      width: auto;
      max-width: 100%;
      /* portrait photo: bound it by viewport height so it never towers on desktop */
      max-height: min(72vh, 620px);
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65);
    }

    figcaption {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* the caption is muted; “it” is not */
    figcaption em {
      color: var(--fg);
      font-style: italic;
    }

    /* gentle arrival, skipped for anyone who'd rather not */
    @media (prefers-reduced-motion: no-preference) {
      figure, h1 { animation: rise 0.7s ease-out both; }
      figure { animation-delay: 0.12s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <h1>Do not stand in his way.</h1>

  <figure>
    <img src="cat.jpg" width="666" height="1180"
         alt="A grey tabby cat sitting in a dimly lit room, mouth open and eyes
              reflecting the light, staring intently at something above.">
    <figcaption>He’s protecting you from <em>it</em>.</figcaption>
  </figure>
</body>
</html>
